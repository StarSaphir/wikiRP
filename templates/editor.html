<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect Editor - {{ slug }}</title>
    
    <!-- Quill CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.css">
    
    <!-- CSS partagé éditeur/viewer (styles des composants) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared-components.css') }}">
    
    <!-- Editor CSS (layout de l'interface uniquement) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='./css/editor.css') }}">
</head>
<body>
    <div class="editor-container">
        <!-- Toolbar Gauche -->
        <aside class="toolbar">
            <div class="toolbar-header">
                <div class="toolbar-tabs">
                    <button class="tab-btn active" data-tab="add">➕ Ajouter</button>
                    <button class="tab-btn" data-tab="list">📋 Liste</button>
                </div>
            </div>
            
            <!-- Onglet Ajouter -->
            <div class="tab-content active" id="tab-add">
                <p style="color: #666; font-size: 12px; margin-bottom: 15px;">Glissez-déposez sur le canvas</p>
                <button class="tool-btn" data-type="text" draggable="true">📝 Texte Riche</button>
                <button class="tool-btn" data-type="image" draggable="true">🖼️ Image</button>
                <button class="tool-btn" data-type="gallery" draggable="true">🎞️ Galerie</button>
                <button class="tool-btn" data-type="video" draggable="true">🎬 Vidéo</button>
                <button class="tool-btn" data-type="youtube" draggable="true">📺 YouTube</button>
                <button class="tool-btn" data-type="shape" draggable="true">⬛ Forme</button>
                <button class="tool-btn" data-type="table" draggable="true">📊 Tableau</button>
                <button class="tool-btn" data-type="separator" draggable="true">➖ Séparateur</button>
            </div>
            
            <!-- Onglet Liste -->
            <div class="tab-content" id="tab-list">
                <p style="color: #666; font-size: 12px; margin-bottom: 15px;">Cliquez pour sélectionner</p>
                <div id="components-list"></div>
            </div>
            
            <div class="toolbar-section">
                <h4>Actions</h4>
                <button id="save-btn" class="action-btn">💾 Sauvegarder</button>
                <button id="copy-page-btn" class="action-btn">📋 Copier Layout</button>
                <button id="grid-toggle" class="action-btn">🔲 Grille (ON)</button>
            </div>
        </aside>

        <!-- Canvas Principal -->
        <main class="canvas-area">
            <div class="canvas-toolbar">
                <button class="back-btn" onclick="window.location.href='/'">⬅️ Retour au Dashboard</button>
                <span class="page-title">{{ slug }}</span>
                <div class="canvas-controls">
                    <div class="mode-toggle">
                        <button id="mode-normal" class="mode-btn active" title="Mode normal">🖱️ Normal</button>
                        <button id="mode-move" class="mode-btn" title="Mode déplacement">✋ Déplacement</button>
                    </div>
                    <label>
                        Grille: <input type="number" id="grid-size" value="10" min="5" max="50" step="5">px
                    </label>
                    <button id="preview-btn">👁️ Prévisualiser</button>
                </div>
            </div>
            <div class="canvas" id="canvas">
                <div class="canvas-inner" id="canvas-inner"></div>
            </div>
        </main>

        <!-- Panneau Propriétés Droite -->
        <aside class="properties-panel" id="properties-panel">
            <div class="properties-header">
                <h3>Propriétés</h3>
                <button id="close-props">✕</button>
            </div>
            <div id="properties-content">
                <p class="no-selection">Sélectionnez un composant</p>
            </div>
        </aside>
    </div>

    <!-- Modales (seront créées dynamiquement par les modules JS) -->
    <!-- Les modules modals/*.js créent leurs propres modales -->

    <!-- Scripts -->
    <!-- Interact.js pour drag & resize -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.19/dist/interact.min.js"></script>
    
    <!-- Quill pour éditeur de texte -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
    
    <!-- Injection des données Flask -->
    <script>
        window.SLUG = "{{ slug }}";
        window.INITIAL_LAYOUT = {{ layout|tojson|safe }};
    </script>
    
    <!-- Application principale (module ES6) -->
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
