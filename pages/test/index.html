    <script>
        const PAGE_HEADINGS = [];
        const INTERNAL_LINKS = [];
        const CURRENT_SLUG = "test";
        const PAGES_METADATA = {"union-federale-balte-ufb": {"title": "Union Fédérale Balte (UFB)", "slug": "union-federale-balte-ufb", "preview": "Présentation générale L’Union Fédérale Balte (UFB) est un État fédéral situé en Europe du Nord-Est, structuré autour du bassin de la mer Baltique. Elle regroupe plusieurs peuples et territoires histor...", "hidden_from_nav": false, "tags": ["pays"]}, "test": {"title": "test", "slug": "test", "preview": "Lorem ipsum Titre Text 2", "hidden_from_nav": false, "tags": []}, "test2": {"title": "test2", "slug": "test2", "preview": "Test 12", "hidden_from_nav": false, "tags": []}};

        const homeBtn = document.querySelector('.home-btn');
        if (homeBtn) {
            homeBtn.addEventListener('mouseenter', () => {
                homeBtn.style.transform = 'translateY(-2px)';
                homeBtn.style.boxShadow = '0 4px 15px rgba(74, 158, 255, 0.5)';
            });
            homeBtn.addEventListener('mouseleave', () => {
                homeBtn.style.transform = 'translateY(0)';
                homeBtn.style.boxShadow = '0 2px 8px rgba(74, 158, 255, 0.3)';
            });
        }
        
        fetch('../../data/inventory.json')
            .then(res => res.json())
            .then(pages => {
                const visiblePages = pages.filter(p => !p.hidden_from_nav);
                const referencedPages = visiblePages.filter(p => INTERNAL_LINKS.includes(p.slug) && p.slug !== CURRENT_SLUG);
                const otherPages = visiblePages.filter(p => !INTERNAL_LINKS.includes(p.slug) && p.slug !== CURRENT_SLUG);
                
                if (referencedPages.length > 0) {
                    document.getElementById('internal-links-section').style.display = 'block';
                    const internalList = document.getElementById('internal-links-list');
                    referencedPages.forEach(page => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = `../${page.slug}/`;
                        a.textContent = page.title;
                        li.appendChild(a);
                        internalList.appendChild(li);
                    });
                }
                
                const otherList = document.getElementById('other-pages-list');
                otherPages.forEach(page => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `../${page.slug}/`;
                    a.textContent = page.title;
                    li.appendChild(a);
                    otherList.appendChild(li);
                });
            })
            .catch(err => console.error('Erreur chargement navigation:', err));
        
        if (PAGE_HEADINGS.length > 0) {
            const tocList = document.getElementById('toc-list');
            tocList.innerHTML = '';
            PAGE_HEADINGS.forEach(heading => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#${heading.id}`;
                a.textContent = heading.text;
                a.classList.add(`level-${heading.level}`);
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = document.getElementById(heading.id);
                    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                li.appendChild(a);
                tocList.appendChild(li);
            });
        }
        
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                document.getElementById('nav-links').style.display = tab === 'links' ? 'block' : 'none';
                document.getElementById('nav-toc').style.display = tab === 'toc' ? 'block' : 'none';
            });
        });
        
        const preview = document.getElementById('link-preview');
        let previewTimeout;
        let isOverPreview = false;
        
        function showLinkPreview(linkElement) {
            const href = linkElement.getAttribute('href');
            const match = href.match(/\.\.\/([^\/]+)\//);
            if (!match) return;
            
            const targetSlug = match[1];
            const metadata = PAGES_METADATA[targetSlug];
            
            if (!metadata) {
                console.warn('Pas de métadonnées pour', targetSlug);
                return;
            }
            
            document.getElementById('preview-title').textContent = metadata.title;
            document.getElementById('preview-content').textContent = metadata.preview;
            
            const rect = linkElement.getBoundingClientRect();
            preview.style.display = 'block';
            
            let left = rect.right + 15;
            let top = rect.top;
            
            if (left + 400 > window.innerWidth) {
                left = rect.left - 415;
            }
            
            if (top + 250 > window.innerHeight) {
                top = window.innerHeight - 260;
            }
            
            preview.style.left = left + 'px';
            preview.style.top = top + 'px';
        }
        
        document.querySelectorAll('.text-content a[href*="../"]').forEach(link => {
            link.addEventListener('mouseenter', (e) => {
                clearTimeout(previewTimeout);
                previewTimeout = setTimeout(() => {
                    showLinkPreview(e.target);
                }, 300);
            });
            
            link.addEventListener('mouseleave', () => {
                clearTimeout(previewTimeout);
                setTimeout(() => {
                    if (!isOverPreview) {
                        preview.style.display = 'none';
                    }
                }, 200);
            });
        });
        
        preview.addEventListener('mouseenter', () => {
            isOverPreview = true;
        });
        
        preview.addEventListener('mouseleave', () => {
            isOverPreview = false;
            preview.style.display = 'none';
        });
        
        document.querySelectorAll('.component-gallery img').forEach(img => {
            img.addEventListener('click', () => {
                const lightbox = document.createElement('div');
                lightbox.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:10000;cursor:pointer';
                const enlargedImg = document.createElement('img');
                enlargedImg.src = img.src;
                enlargedImg.style.cssText = 'max-width:90%;max-height:90%;object-fit:contain';
                lightbox.appendChild(enlargedImg);
                lightbox.onclick = () => lightbox.remove();
                document.body.appendChild(lightbox);
            });
        });
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
        
        document.querySelectorAll('.component').forEach(component => {
            component.style.opacity = '0';
            component.style.transform = 'translateY(20px)';
            component.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
            observer.observe(component);
        });
        
        console.log('✅ Viewer initialisé');
        console.log('📊 Métadonnées:', Object.keys(PAGES_METADATA).length, 'pages');
    </script>
    <script>
        // responsive-layout.js - Gestion par groupes avec compensation

class ResponsiveLayout {
    constructor(options = {}) {
        this.config = {
            // ⚠️ Largeur canonique : doit correspondre à .canvas-inner (editor.css)
            // et .canvas-container (viewer.css) — actuellement 1400px.
            editorCanvasWidth: options.editorCanvasWidth || 1400,
            editorCanvasHeight: options.editorCanvasHeight || 1080,
            
            contentMarginLeft: options.contentMarginLeft || 280,
            contentPadding: options.contentPadding || 40,
            
            breakpoints: {
                mobile: 768,
                tablet: 1024,
                desktop: 1440
            },
            
            minSizes: {
                text: { w: 200, h: 40 },
                image: { w: 100, h: 80 },
                gallery: { w: 200, h: 150 },
                video: { w: 250, h: 150 },
                youtube: { w: 250, h: 150 },
                shape: { w: 80, h: 40 },
                table: { w: 200, h: 100 },
                separator: { w: 80, h: 2 }
            },
            
            overlapThreshold: 0.05, // 5% = superposition
            
            ...options
        };
        
        this.originalLayout = null;
        this.currentBreakpoint = this.detectBreakpoint();
    }
    
    init(components) {
        console.log('🔧 Init avec groupes et compensation');
        
        this.originalLayout = this.deepClone(components);
        this.currentBreakpoint = this.detectBreakpoint();
        
        const availableWidth = this.getAvailableWidth();
        
        console.log(`📐 ${this.config.editorCanvasWidth}px → ${availableWidth}px`);
        
        const responsiveComponents = this.applyResponsive(components, availableWidth);
        this.setupResizeListener();
        
        console.log(`✅ ${responsiveComponents.length} composants`);
        
        return responsiveComponents;
    }
    
    detectBreakpoint() {
        const width = window.innerWidth;
        if (width <= this.config.breakpoints.mobile) return 'mobile';
        if (width <= this.config.breakpoints.tablet) return 'tablet';
        if (width <= this.config.breakpoints.desktop) return 'desktop';
        return 'wide';
    }
    
    getAvailableWidth() {
        const screenWidth = window.innerWidth;
        const bp = this.currentBreakpoint;
        
        if (bp === 'mobile') {
            return screenWidth - (this.config.contentPadding * 2);
        }
        
        // Largeur brute disponible = écran - sidebar - padding
        const raw = screenWidth - this.config.contentMarginLeft - (this.config.contentPadding * 2);
        
        // ✅ FIX : Le canvas est limité à editorCanvasWidth (max-width).
        // Si l'écran est plus grand que le canvas, la largeur disponible est
        // exactement editorCanvasWidth — pas plus. Sans ce cap, le ratio
        // dépasse 1.0 et les composants sont agrandis hors de la page.
        return Math.min(raw, this.config.editorCanvasWidth);
    }
    
    getScalingRatio(availableWidth) {
        let ratio = availableWidth / this.config.editorCanvasWidth;
        
        const bp = this.currentBreakpoint;
        if (bp === 'mobile') ratio = Math.min(ratio, 0.6);
        else if (bp === 'tablet') ratio = Math.min(ratio, 0.8);
        
        return Math.max(ratio, 0.3);
    }
    
    applyResponsive(components, availableWidth) {
        const ratio = this.getScalingRatio(availableWidth);
        
        console.log(`📐 Ratio: ${(ratio * 100).toFixed(1)}%`);
        
        let adjusted = this.deepClone(components);
        
        // 1. Créer les groupes de composants superposés
        const groups = this.buildGroups(adjusted);
        console.log(`📦 ${groups.length} groupes`);
        
        // 2. Trier par Y minimum du groupe
        groups.sort((a, b) => a.minY - b.minY);
        
        // 3. Traiter chaque groupe
        let result = [];
        let cumulativeOffset = 0;
        
        for (let group of groups) {
            const processed = this.processGroup(group, ratio, availableWidth, cumulativeOffset);
            result = result.concat(processed.components);
            
            // Ajouter la croissance du groupe à l'offset
            cumulativeOffset += processed.totalGrowth;
            
            if (processed.totalGrowth > 0) {
                console.log(`🔽 Groupe ${group.id}: +${processed.totalGrowth.toFixed(0)}px ajouté à l'offset (total: ${cumulativeOffset.toFixed(0)}px)`);
            }
        }
        
        return result;
    }
    
    /**
     * 🎯 Construit des groupes de composants superposés
     */
    buildGroups(components) {
        const groups = [];
        const assigned = new Set();
        let groupId = 0;
        
        components.sort((a, b) => a.y - b.y);
        
        for (let comp of components) {
            if (assigned.has(comp.id)) continue;
            
            const group = {
                id: `group-${groupId++}`,
                components: [comp],
                minY: comp.y,
                maxY: comp.y + comp.h
            };
            assigned.add(comp.id);
            
            // Expansion du groupe : chercher tous les composants qui chevauchent
            let changed = true;
            while (changed) {
                changed = false;
                
                for (let other of components) {
                    if (assigned.has(other.id)) continue;
                    
                    // Vérifier si other chevauche UN membre du groupe
                    for (let member of group.components) {
                        if (this.doOverlap(member, other)) {
                            const ratio = this.getOverlapRatio(member, other);
                            
                            if (ratio > this.config.overlapThreshold) {
                                group.components.push(other);
                                group.minY = Math.min(group.minY, other.y);
                                group.maxY = Math.max(group.maxY, other.y + other.h);
                                assigned.add(other.id);
                                changed = true;
                                break;
                            }
                        }
                    }
                }
            }
            
            if (group.components.length > 1) {
                console.log(`  📦 ${group.id}: ${group.components.map(c => c.id).join(', ')}`);
            }
            
            groups.push(group);
        }
        
        return groups;
    }
    
    /**
     * 🎯 Traite un groupe entier
     */
    processGroup(group, ratio, availableWidth, offsetY) {
        const components = group.components;
        const result = [];
        let maxGrowth = 0;
        
        if (components.length === 1) {
            // Groupe simple (1 composant)
            const comp = this.scaleComponent(components[0], ratio, availableWidth);
            
            // Appliquer l'offset cumulé
            comp.y = (components[0].y * ratio) + offsetY;
            
            if (comp.type === 'text' || comp.type === 'table') {
                const growth = this.adjustTextHeight(comp);
                maxGrowth = growth;
            }
            
            result.push(comp);
        } else {
            // Groupe superposé (infobox)
            console.log(`  ✨ Traitement groupe: ${components.length} composants`);
            
            // Point de référence du groupe
            const refY = Math.min(...components.map(c => c.y));
            
            // Scaler chaque composant en préservant les positions RELATIVES
            for (let comp of components) {
                const scaled = this.scaleComponent(comp, ratio, availableWidth);
                
                // 🎯 CLEF : Position relative au groupe préservée
                const relativeY = comp.y - refY;
                scaled.y = (refY * ratio) + (relativeY * ratio) + offsetY;
                
                // Ajuster hauteur des textes
                if (comp.type === 'text' || comp.type === 'table') {
                    const growth = this.adjustTextHeight(scaled);
                    maxGrowth = Math.max(maxGrowth, growth);
                }
                
                result.push(scaled);
            }
        }
        
        return {
            components: result,
            totalGrowth: maxGrowth
        };
    }
    
    scaleComponent(component, ratio, availableWidth) {
        const minSize = this.config.minSizes[component.type] || { w: 100, h: 100 };
        const scaled = { ...component };
        
        scaled.x = component.x * ratio;
        scaled.w = Math.max(minSize.w, component.w * ratio);
        scaled.h = Math.max(minSize.h, component.h * ratio);
        
        if (scaled.x + scaled.w > availableWidth) {
            scaled.w = Math.max(minSize.w, availableWidth - scaled.x - 10);
        }
        
        scaled._scaledH = scaled.h;
        
        return scaled;
    }
    
    /**
     * Ajuste la hauteur d'un texte et retourne la croissance.
     * 
     * ⚠️ ATTENTION — Timing CSS :
     * Cette méthode mesure le scrollHeight de l'élément DOM.
     * Elle doit être appelée APRÈS que les feuilles de style partagées
     * (shared-components.css) soient appliquées par le navigateur.
     * Si appelée trop tôt (avant le premier repaint), le navigateur
     * utilise ses styles par défaut et retourne un scrollHeight erroné
     * (souvent 2-3x trop grand), créant des espaces vides géants.
     * → Le setTimeout(200) dans l'init() de la page protège contre ça.
     */
    adjustTextHeight(comp) {
        const element = document.getElementById(comp.id);
        if (!element) return 0;
        
        const content = element.querySelector('.text-content') || element;
        
        // Sauvegarder les styles courants
        const oldW = element.style.width;
        const oldH = element.style.height;
        const oldOverflow = content.style.overflowY;
        
        // Appliquer la largeur cible pour mesurer le wrapping réel du texte
        element.style.width = `${comp.w}px`;
        element.style.height = 'auto';
        content.style.overflowY = 'visible';
        
        // Forcer le reflow
        void element.offsetHeight;
        
        const measured = content.scrollHeight;
        
        // Restaurer
        element.style.width = oldW;
        element.style.height = oldH;
        content.style.overflowY = oldOverflow;
        
        const minH = this.config.minSizes[comp.type]?.h || 40;
        const scaledH = comp._scaledH;
        
        // ✅ FIX : Plafonner la hauteur mesurée.
        // Si le CSS n'est pas encore rendu au moment de la mesure, scrollHeight
        // peut être fantaisiste (ex: 1200px pour 3 lignes de texte).
        // On refuse d'accepter une hauteur > 3× la hauteur scalée sauf si la
        // hauteur scalée est très petite (composant volontairement petit).
        const MAX_GROWTH_RATIO = 3.0;
        const cappedH = scaledH > 60
            ? Math.min(measured, scaledH * MAX_GROWTH_RATIO)
            : measured;
        
        comp.h = Math.max(minH, cappedH + 3);
        
        const growth = comp.h - scaledH;
        
        if (growth > 5) {
            console.log(`    📏 ${comp.id}: +${growth.toFixed(0)}px (mesuré: ${measured}px, capé: ${cappedH.toFixed(0)}px)`);
        }
        
        delete comp._scaledH;
        
        return Math.max(0, growth);
    }
    
    doOverlap(c1, c2) {
        return !(
            c1.x + c1.w <= c2.x ||
            c2.x + c2.w <= c1.x ||
            c1.y + c1.h <= c2.y ||
            c2.y + c2.h <= c1.y
        );
    }
    
    getOverlapRatio(c1, c2) {
        const x1 = Math.max(c1.x, c2.x);
        const y1 = Math.max(c1.y, c2.y);
        const x2 = Math.min(c1.x + c1.w, c2.x + c2.w);
        const y2 = Math.min(c1.y + c1.h, c2.y + c2.h);
        
        const overlapArea = (x2 - x1) * (y2 - y1);
        const area1 = c1.w * c1.h;
        const area2 = c2.w * c2.h;
        const minArea = Math.min(area1, area2);
        
        return overlapArea / minArea;
    }
    
    applyToDOM(components) {
        components.forEach(comp => {
            const el = document.getElementById(comp.id);
            if (!el) return;
            
            el.style.transition = 'all 0.3s ease';
            el.style.left = `${comp.x}px`;
            el.style.top = `${comp.y}px`;
            el.style.width = `${comp.w}px`;
            el.style.height = `${comp.h}px`;
            
            if (comp.type === 'text' || comp.type === 'table') {
                this.setTextStyle(el);
            }
        });
        
        this.setCanvasHeight(components);
    }
    
    setTextStyle(element) {
        const content = element.querySelector('.text-content');
        if (!content) return;
        
        const ratio = this.getScalingRatio(this.getAvailableWidth());
        const bp = this.currentBreakpoint;
        
        let size = 15;
        if (bp === 'mobile') size = 13;
        else if (bp === 'tablet') size = 14;
        
        size = Math.max(11, size * Math.min(ratio, 1));
        
        content.style.fontSize = `${size}px`;
        content.style.lineHeight = '1.6';
        content.style.padding = '12px';
        content.style.overflowY = 'auto';
        content.style.boxSizing = 'border-box';
    }
    
    setCanvasHeight(components) {
        const canvas = document.querySelector('.canvas-container');
        if (!canvas) return;
        
        let max = 0;
        components.forEach(c => {
            const bottom = c.y + c.h;
            if (bottom > max) max = bottom;
        });
        
        canvas.style.minHeight = `${max + 100}px`;
    }
    
    setupResizeListener() {
        let timer;
        
        window.addEventListener('resize', () => {
            clearTimeout(timer);
            
            timer = setTimeout(() => {
                const newBp = this.detectBreakpoint();
                
                if (newBp !== this.currentBreakpoint) {
                    console.log(`🔄 ${this.currentBreakpoint} → ${newBp}`);
                    this.currentBreakpoint = newBp;
                    
                    if (this.originalLayout) {
                        const w = this.getAvailableWidth();
                        const resp = this.applyResponsive(this.originalLayout, w);
                        this.applyToDOM(resp);
                    }
                }
            }, 250);
        });
    }
    
    deepClone(obj) {
        return JSON.parse(JSON.stringify(obj));
    }
    
    showDebugOverlay() {
        document.getElementById('responsive-debug-overlay')?.remove();
        
        const div = document.createElement('div');
        div.id = 'responsive-debug-overlay';
        div.style.cssText = `
            position: fixed;
            bottom: 20px;
            left: 300px;
            background: rgba(0,0,0,0.95);
            color: #0f0;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            z-index: 100000;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,255,0,0.5);
            border: 2px solid #0f0;
        `;
        
        const w = this.getAvailableWidth();
        const r = this.getScalingRatio(w);
        
        const comps = document.querySelectorAll('.component');
        let overflow = 0;
        
        comps.forEach(el => {
            if (el.dataset.type === 'text') {
                const txt = el.querySelector('.text-content');
                if (txt && txt.scrollHeight > txt.clientHeight + 5) {
                    overflow++;
                    console.warn(`⚠️ Overflow: ${el.id}`);
                }
            }
        });
        
        div.innerHTML = `
            <strong style="color:#0ff;font-size:14px;">📊 DEBUG GROUPES</strong><br>
            <div style="margin-top:10px;padding-top:10px;border-top:1px solid #0f0;">
                BP: <span style="color:#ff0;">${this.currentBreakpoint}</span><br>
                Ratio: <span style="color:#ff0;">${(r*100).toFixed(0)}%</span><br>
                Seuil overlap: <span style="color:#ff0;">${(this.config.overlapThreshold*100).toFixed(0)}%</span><br>
                Canvas: <span style="color:#ff0;">${this.config.editorCanvasWidth}px</span><br>
                Dispo: <span style="color:#ff0;">${w}px</span><br>
                Comps: <span style="color:#ff0;">${this.originalLayout?.length || 0}</span><br>
                <strong style="color:${overflow>0?'#f00':'#0f0'}">Overflow: ${overflow}</strong>
            </div>
            <div style="margin-top:10px;font-size:10px;color:#999;">
                Les groupes superposés gardent<br>
                leurs positions relatives intactes
            </div>
            <div style="margin-top:10px;">
                <button onclick="window.responsiveLayout.hideDebugOverlay()" style="
                    background:#f00;color:white;border:none;padding:8px 15px;
                    border-radius:4px;cursor:pointer;font-size:12px;font-weight:bold;
                ">✖</button>
            </div>
        `;
        
        document.body.appendChild(div);
    }
    
    hideDebugOverlay() {
        document.getElementById('responsive-debug-overlay')?.remove();
    }
    
    reset() {
        if (!this.originalLayout) return;
        this.applyToDOM(this.originalLayout);
    }
}

// INIT
if (typeof window !== 'undefined') {
    document.addEventListener('DOMContentLoaded', () => {
        // ✅ FIX : On attend que les feuilles de style (shared-components.css,
        // viewer.css) soient appliquées ET que le navigateur ait fait son premier
        // rendu avant de mesurer les heights. requestAnimationFrame() garantit
        // qu'on est dans le cycle de rendu suivant, après l'application du CSS.
        //
        // Pourquoi deux rAF ?
        // - 1er rAF : CSS appliqué, mais le layout peut ne pas être calculé.
        // - 2ème rAF : Layout calculé et stable, mesures fiables.
        //
        // Le setTimeout(100) ajoute une marge supplémentaire pour les CSS externes
        // (CDN Quill, etc.) qui peuvent charger légèrement après DOMContentLoaded.
        
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                setTimeout(() => {
                    const comps = Array.from(document.querySelectorAll('.component')).map(el => {
                        const tc = Array.from(el.classList).find(c => c.startsWith('component-'));
                        const type = tc ? tc.replace('component-', '') : 'unknown';
                        
                        return {
                            id: el.id,
                            type: type,
                            x: parseFloat(el.style.left) || 0,
                            y: parseFloat(el.style.top) || 0,
                            w: parseFloat(el.style.width) || 300,
                            h: parseFloat(el.style.height) || 200,
                            z: parseInt(el.style.zIndex) || 0
                        };
                    });
                    
                    if (comps.length > 0) {
                        const cw = parseInt(document.querySelector('meta[name="editor-canvas-width"]')?.content) || 1400;
                        
                        console.log(`📦 ${comps.length} composants | Canvas éditeur: ${cw}px`);
                        
                        window.responsiveLayout = new ResponsiveLayout({
                            editorCanvasWidth: cw
                        });
                        
                        const resp = window.responsiveLayout.init(comps);
                        window.responsiveLayout.applyToDOM(resp);
                        
                        console.log('✅ Responsive initialisé');
                    }
                }, 100);
            });
        });
    });
}

if (typeof module !== 'undefined' && module.exports) {
    module.exports = ResponsiveLayout;
}
        // utils/debug.js - Utilitaires de debug pour le système responsive

/**
 * Classe d'utilitaires de debug
 */
class ResponsiveDebugUtils {
    constructor() {
        this.overlaysActive = new Set();
        this.setupGlobalCommands();
    }
    
    /**
     * Setup des commandes globales
     */
    setupGlobalCommands() {
        if (typeof window !== 'undefined') {
            window.ResponsiveDebug = {
                // Afficher les contours
                showBorders: () => this.showComponentBorders(),
                hideBorders: () => this.hideComponentBorders(),
                
                // Afficher les coordonnées
                showCoords: () => this.showComponentCoords(),
                hideCoords: () => this.hideComponentCoords(),
                
                // Afficher les infos de texte
                showTextInfo: () => this.showTextInfo(),
                hideTextInfo: () => this.hideTextInfo(),
                
                // Tout afficher
                showAll: () => {
                    this.showComponentBorders();
                    this.showComponentCoords();
                    this.showTextInfo();
                },
                
                // Tout cacher
                hideAll: () => {
                    this.hideComponentBorders();
                    this.hideComponentCoords();
                    this.hideTextInfo();
                },
                
                // Overlay principal
                showOverlay: () => window.responsiveLayout?.showDebugOverlay(),
                hideOverlay: () => window.responsiveLayout?.hideDebugOverlay(),
                
                // Rapport complet
                report: () => this.generateReport(),
                
                // Vérifier la taille du canvas
                checkCanvasSize: () => this.checkCanvasSize()
            };
            
            console.log('🛠️ Debug utils chargés. Commandes disponibles:');
            console.log('  ResponsiveDebug.showBorders()');
            console.log('  ResponsiveDebug.showCoords()');
            console.log('  ResponsiveDebug.showTextInfo()');
            console.log('  ResponsiveDebug.showAll()');
            console.log('  ResponsiveDebug.hideAll()');
            console.log('  ResponsiveDebug.report()');
            console.log('  ResponsiveDebug.checkCanvasSize()');
        }
    }
    
    /**
     * ✅ Vérifier la taille du canvas (NOUVEAU)
     */
    checkCanvasSize() {
        const meta = {
            width: document.querySelector('meta[name="editor-canvas-width"]')?.content,
            height: document.querySelector('meta[name="editor-canvas-height"]')?.content
        };
        
        const canvas = document.querySelector('.canvas-container');
        const actual = canvas ? {
            width: canvas.offsetWidth,
            height: canvas.offsetHeight
        } : null;
        
        console.group('📐 Vérification taille canvas');
        console.log('Meta tags:', meta);
        console.log('Canvas actuel:', actual);
        
        // Largeur canonique = 1400px (définie dans editor.css + viewer.css)
        const CANONICAL = 1400;
        if (meta.width && Math.abs(parseInt(meta.width) - CANONICAL) > 50) {
            console.warn('⚠️ PROBLÈME: Canvas éditeur non canonique!');
            console.warn(`   Valeur actuelle: ${meta.width}px`);
            console.warn(`   Valeur attendue: ~${CANONICAL}px`);
            console.warn('   → Resauvegardez la page depuis l\'éditeur pour corriger.');
        } else if (meta.width) {
            console.log(`✅ Canvas OK: ${meta.width}px (~${CANONICAL}px attendu)`);
        }
        
        console.groupEnd();
        
        return { meta, actual };
    }
    
    /**
     * Afficher les contours des composants
     */
    showComponentBorders() {
        if (this.overlaysActive.has('borders')) return;
        
        const style = document.createElement('style');
        style.id = 'debug-borders';
        style.textContent = `
            .component {
                outline: 2px solid rgba(255, 0, 0, 0.5) !important;
                outline-offset: -2px;
            }
            
            .component::before {
                content: attr(id) " (" attr(data-type) ")";
                position: absolute;
                top: 0;
                left: 0;
                background: rgba(255, 0, 0, 0.8);
                color: white;
                padding: 2px 6px;
                font-size: 10px;
                font-family: monospace;
                z-index: 100000;
                pointer-events: none;
            }
            
            .component-text {
                outline-color: rgba(0, 255, 0, 0.5) !important;
            }
            
            .component-text::before {
                background: rgba(0, 255, 0, 0.8) !important;
            }
        `;
        
        document.head.appendChild(style);
        this.overlaysActive.add('borders');
        
        console.log('✅ Contours affichés (rouge = général, vert = texte)');
    }
    
    hideComponentBorders() {
        document.getElementById('debug-borders')?.remove();
        this.overlaysActive.delete('borders');
        console.log('❌ Contours masqués');
    }
    
    /**
     * Afficher les coordonnées des composants
     */
    showComponentCoords() {
        if (this.overlaysActive.has('coords')) return;
        
        document.querySelectorAll('.component').forEach(el => {
            const coords = document.createElement('div');
            coords.className = 'debug-coords';
            coords.style.cssText = `
                position: absolute;
                bottom: 0;
                right: 0;
                background: rgba(0, 0, 255, 0.8);
                color: white;
                padding: 4px 8px;
                font-size: 10px;
                font-family: monospace;
                z-index: 100000;
                pointer-events: none;
                border-radius: 3px 0 0 0;
            `;
            
            const x = parseFloat(el.style.left) || 0;
            const y = parseFloat(el.style.top) || 0;
            const w = parseFloat(el.style.width) || 0;
            const h = parseFloat(el.style.height) || 0;
            
            coords.textContent = `X:${x.toFixed(0)} Y:${y.toFixed(0)} W:${w.toFixed(0)} H:${h.toFixed(0)}`;
            el.appendChild(coords);
        });
        
        this.overlaysActive.add('coords');
        console.log('✅ Coordonnées affichées');
    }
    
    hideComponentCoords() {
        document.querySelectorAll('.debug-coords').forEach(el => el.remove());
        this.overlaysActive.delete('coords');
        console.log('❌ Coordonnées masquées');
    }
    
    /**
     * Afficher les infos de texte
     */
    showTextInfo() {
        if (this.overlaysActive.has('textinfo')) return;
        
        document.querySelectorAll('.component-text').forEach(el => {
            const textContent = el.querySelector('.text-content');
            if (!textContent) return;
            
            const info = document.createElement('div');
            info.className = 'debug-textinfo';
            info.style.cssText = `
                position: absolute;
                top: 0;
                right: 0;
                background: rgba(255, 165, 0, 0.9);
                color: white;
                padding: 4px 8px;
                font-size: 10px;
                font-family: monospace;
                z-index: 100001;
                pointer-events: none;
                max-width: 200px;
                border-radius: 0 0 0 3px;
            `;
            
            const fontSize = window.getComputedStyle(textContent).fontSize;
            const lineHeight = window.getComputedStyle(textContent).lineHeight;
            const textLength = textContent.textContent.length;
            const scrollHeight = textContent.scrollHeight;
            const clientHeight = textContent.clientHeight;
            const overflow = scrollHeight > clientHeight;
            
            info.innerHTML = `
                Font: ${fontSize}<br>
                Line: ${lineHeight}<br>
                Chars: ${textLength}<br>
                ${overflow ? '<strong style="color:#ff0;">⚠️ OVERFLOW!</strong>' : '✓ OK'}
            `;
            
            el.appendChild(info);
        });
        
        this.overlaysActive.add('textinfo');
        console.log('✅ Infos texte affichées');
    }
    
    hideTextInfo() {
        document.querySelectorAll('.debug-textinfo').forEach(el => el.remove());
        this.overlaysActive.delete('textinfo');
        console.log('❌ Infos texte masquées');
    }
    
    /**
     * Générer un rapport complet
     */
    generateReport() {
        const components = Array.from(document.querySelectorAll('.component'));
        const info = window.responsiveLayout?.getDebugInfo();
        
        console.group('📊 RAPPORT RESPONSIVE COMPLET');
        
        // Infos générales
        console.log('📐 Configuration:');
        console.table(info);
        
        // Vérification canvas
        const canvasCheck = this.checkCanvasSize();
        
        // Infos par composant
        console.log('\n📦 Composants:');
        const componentData = components.map(el => {
            const type = el.dataset.type;
            const x = parseFloat(el.style.left) || 0;
            const y = parseFloat(el.style.top) || 0;
            const w = parseFloat(el.style.width) || 0;
            const h = parseFloat(el.style.height) || 0;
            
            // Calculer si le texte overflow
            let overflow = false;
            if (type === 'text') {
                const textContent = el.querySelector('.text-content');
                if (textContent) {
                    overflow = textContent.scrollHeight > textContent.clientHeight;
                }
            }
            
            return {
                id: el.id,
                type,
                x: x.toFixed(0),
                y: y.toFixed(0),
                w: w.toFixed(0),
                h: h.toFixed(0),
                overflow: overflow ? '⚠️' : '✓'
            };
        });
        
        console.table(componentData);
        
        // Problèmes détectés
        const problems = [];
        
        if (canvasCheck.meta.width && Math.abs(parseInt(canvasCheck.meta.width) - 1400) > 50) {
            problems.push(`Canvas éditeur non canonique (${canvasCheck.meta.width}px au lieu de ~1400px)`);
        }
        
        const overflowCount = componentData.filter(c => c.overflow === '⚠️').length;
        if (overflowCount > 0) {
            problems.push(`${overflowCount} composant(s) texte en overflow`);
        }
        
        if (info && info.ratio > 1.1) {
            problems.push('Ratio > 110% : écran plus grand que l\'éditeur (pas normal)');
        }
        
        if (problems.length > 0) {
            console.warn('\n⚠️ PROBLÈMES DÉTECTÉS:');
            problems.forEach((p, i) => console.warn(`  ${i + 1}. ${p}`));
        } else {
            console.log('\n✅ Aucun problème détecté');
        }
        
        console.groupEnd();
        
        return {
            info,
            components: componentData,
            problems
        };
    }
}

// Initialisation automatique
if (typeof window !== 'undefined') {
    document.addEventListener('DOMContentLoaded', () => {
        window.debugUtils = new ResponsiveDebugUtils();
    });
}

// Export
if (typeof module !== 'undefined' && module.exports) {
    module.exports = ResponsiveDebugUtils;
}
